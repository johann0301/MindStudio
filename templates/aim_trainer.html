<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aim Trainer | Mind Studio</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    padding-top: 80px;
  }

  .aim-container {
    max-width: 600px;
    margin: auto;
    background-color: #1e293b;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 255, 202, 0.3);
  }

  h1 {
    color: #00ffca;
    margin-bottom: 10px;
  }

  #gameArea {
    width: 500px;
    height: 400px;
    margin: 20px auto;
    border: 2px solid #00ffca;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    background-color: #0f172a;
    cursor: crosshair;
  }

  .target {
    position: absolute;
    width: 40px;
    height: 40px;
    background-color: #00ffca;
    border-radius: 50%;
    transition: transform 0.1s;
  }

  .target:active {
    transform: scale(0.85);
  }

  #hud {
    margin-top: 15px;
    font-size: 1rem;
    color: #94a3b8;
  }

  #startBtn {
    margin-top: 20px;
    background-color: #00ffca;
    color: #0f172a;
    border: none;
    padding: 0.8rem 1.5rem;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }

  #startBtn:hover {
    background-color: #00caa7;
  }

  select {
    background-color: #1e293b;
    color: #e2e8f0;
    border: 1px solid #00ffca;
    border-radius: 8px;
    padding: 6px;
    margin-top: 10px;
  }

  a {
    display: inline-block;
    margin-top: 15px;
    color: #00ffca;
    text-decoration: none;
    font-weight: 600;
  }

  a:hover { color: #0ff; }

  .modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.modal-content {
  background-color: #1e293b;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,255,202,0.4);
  text-align: center;
  color: #e2e8f0;
  width: 320px;
  animation: slideUp 0.3s ease;
}

.modal-content h2 {
  color: #00ffca;
  margin-bottom: 10px;
}

.modal-content button {
  margin-top: 15px;
  background: #00ffca;
  color: #0f172a;
  border: none;
  padding: 10px 25px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.modal-content button:hover {
  background: #00caa7;
}

@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

</style>
</head>
<body>
  <div class="aim-container">
    <h1>Aim Trainer 🎯</h1>
    <p>Acerta o maior número de alvos antes do tempo acabar!</p>

    <button id="startBtn">Iniciar Jogo</button>
    <div>
      <label for="difficulty">Dificuldade:</label>
      <select id="difficulty">
        <option value="easy">Fácil</option>
        <option value="medium" selected>Médio</option>
        <option value="hard">Difícil</option>
      </select>
    </div>

    <div id="gameArea"></div>

    <div id="hud">
      <p>⏱️ Tempo: <span id="time">30</span>s</p>
      <p>🎯 Pontos: <span id="score">0</span></p>
      <p>💥 Precisão: <span id="accuracy">0%</span></p>
    </div>

    {% include "partials/save_form_ui.html" %}

    <a href="/#jogos">Voltar ao início</a>
  </div>
<!-- Modal personalizado de fim de jogo -->
<div id="endModal" class="modal">
  <div class="modal-content">
    <h2>🏁 Fim de jogo!</h2>
    <p id="finalScore"></p>
    <p id="finalAccuracy"></p>
    <button id="closeModal">Fechar</button>
  </div>
</div>

  <audio id="hitSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" preload="auto"></audio>
  <audio id="missSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script src="{{ url_for('static', filename='js/aim_trainer.js') }}"></script>
</body>
</html>
