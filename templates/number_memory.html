<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memória Numérica | Mind Studio</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
    body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: 'Poppins', sans-serif;
        text-align: center;
        padding-top: 100px;
        overflow: hidden;
    }

    .memory-container {
        max-width: 600px;
        margin: auto;
        background-color: #1e293b;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 255, 202, 0.3);
        min-height: 400px; /* Altura mínima para o conteúdo */
    }

    h1 {
        color: #00ffca;
        margin-bottom: 10px;
    }

    /* Onde o número ou as mensagens aparecem */
    .number-display {
        background-color: #0f172a;
        padding: 40px 20px;
        border-radius: 8px;
        font-size: 3.5rem; /* Fonte grande para o número */
        margin-top: 25px;
        line-height: 1.6;
        height: 150px; /* Altura fixa */
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: 4px;
        color: #e2e8f0; /* Cor padrão */
    }

    /* Classe para a animação de "fade out" */
    .number-display.fading {
        color: #0f172a; /* Cor some (mesma do fundo) */
        transition: color 0.5s ease-out;
    }

    /* Onde o usuário digita a resposta */
    .input-area {
        margin-top: 20px;
    }

    #numberInput {
        width: 100%;
        background-color: #0f172a;
        border: 2px solid #94a3b8;
        border-radius: 8px;
        padding: 15px;
        font-size: 1.5rem;
        color: #e2e8f0;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
    }
    #numberInput:focus {
        outline: none;
        border-color: #00ffca;
        box-shadow: 0 0 10px #00ffca55;
    }

    /* Botões */
    .btn-game {
        margin-top: 20px;
        background-color: #00ffca;
        color: #0f172a;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        font-size: 1.1rem;
    }
    .btn-game:hover { background-color: #00caa7; }

    /* Painel de estatísticas */
    .hud {
        margin-top: 20px;
        font-size: 1.2rem; /* Um pouco maior */
        color: #94a3b8;
    }

    /* Link para voltar */
    a {
        display: inline-block;
        margin-top: 15px;
        color: #00ffca;
        text-decoration: none;
        font-weight: 600;
    }
    a:hover { color: #0ff; }
</style>
</head>
<body>
<div class="memory-container">
    <h1>Memória Numérica 🧠</h1>
    <p>Memorize o número que aparece na tela.</p>

    <!-- Onde o número aparece -->
    <div class="number-display" id="numberDisplay"></div>
    
    <!-- Onde o usuário digita -->
    <div class="input-area" id="inputArea">
        <input type="text" id="numberInput" placeholder="Qual era o número?">
    </div>

    <!-- Botões de controle -->
    <button id="startBtn" class="btn-game">Começar</button>
    <button id="submitBtn" class="btn-game">Enviar</button>

    <div class="hud">
        <p>Nível: <span id="levelDisplay">1</span></p>
        <p id="statusDisplay"></p> <!-- Para mensagens de erro/acerto -->
    </div>

    {% include "partials/save_form_ui.html" %}

    <a href="/#jogos">Voltar ao início</a>
</div>

<script src="{{ url_for('static', filename='js/number_memory.js') }}"></script>
</body>
</html>
