<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Reação | Mind Studio</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
    /* Estilos base consistentes */
    body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: 'Poppins', sans-serif;
        text-align: center;
        padding-top: 100px;
        overflow: hidden; /* Evita barras de rolagem */
    }

    .reaction-container {
        max-width: 900px; /* Mais largo para o jogo */
        margin: auto;
        /* Remove o fundo do container, o jogo será a tela inteira */
    }

    /* A caixa principal do jogo */
    #reactionBox {
        width: 100%;
        height: 500px; /* Altura grande */
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.1s ease;
    }

    /* O texto dentro da caixa */
    #reactionText {
        font-size: 2.5rem;
        font-weight: 600;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    
    #reactionText small {
        font-size: 1.2rem;
        font-weight: 400;
        display: block;
        margin-top: 10px;
    }

    /* --- ESTADOS DO JOGO --- */

    /* Estado inicial e de resultado (Azul) */
    .state-start {
        background-color: #3b82f6; /* Azul */
    }
    
    /* Estado de espera (Vermelho) */
    .state-wait {
        background-color: #ef4444; /* Vermelho */
    }

    /* Estado de reação (Verde) */
    .state-react {
        background-color: #4ade80; /* Verde */
    }


    /* Link para voltar */
    a {
        display: inline-block;
        margin-top: 25px; /* Mais espaço */
        color: #00ffca;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.2rem;
    }
    a:hover { color: #0ff; }
</style>
</head>
<body>
<div class="reaction-container">
    <!-- A caixa de reação é o jogo todo -->
    <div id="reactionBox">
        <div id="reactionText"></div>
    </div>
    
    {% include "partials/save_form_ui.html" %}

    <a href="/#jogos">Voltar ao início</a>
</div>

<script src="{{ url_for('static', filename='js/reaction_time.js') }}"></script>
</body>
</html>
