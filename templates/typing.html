<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Digitação | Mind Studio</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
    body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: 'Poppins', sans-serif;
        text-align: center;
        padding-top: 100px;
        /* Remove o overflow para evitar barras de rolagem desnecessárias */
        overflow: hidden;
    }

    .typing-container {
        max-width: 700px; /* Um pouco mais largo para o texto */
        margin: auto;
        background-color: #1e293b;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 255, 202, 0.3);
    }

    h1 {
        color: #00ffca;
        margin-bottom: 10px;
    }

    /* Onde a frase-desafio aparece */
    .sentence-display {
        background-color: #0f172a;
        padding: 20px;
        border-radius: 8px;
        font-size: 1.5rem;
        margin-top: 25px;
        line-height: 1.6;
        height: 120px; /* Altura fixa para evitar pulos de layout */
        overflow-y: auto; /* Caso a frase seja muito longa */
        text-align: left;
        font-family: 'Courier New', Courier, monospace;
    }

    /* Estilos para as letras individuais */
    .sentence-display span {
        transition: all 0.1s ease;
    }
    .sentence-display .correct {
        color: #00ffca; /* Verde-água para acerto */
    }
    .sentence-display .incorrect {
        color: #ff0033; /* Vermelho para erro */
        background-color: #ff003322;
        border-radius: 2px;
    }
    .sentence-display .current-char {
        /* Simula um cursor de digitação */
        background-color: #e2e8f0;
        color: #0f172a;
        border-radius: 2px;
    }

    /* A caixa onde o usuário digita */
    #inputArea {
        width: 100%;
        height: 100px;
        margin-top: 20px;
        background-color: #0f172a;
        border: 2px solid #94a3b8;
        border-radius: 8px;
        padding: 10px;
        font-size: 1.2rem;
        color: #e2e8f0;
        font-family: 'Courier New', Courier, monospace;
        resize: none; /* Impede o usuário de redimensionar */
    }
    #inputArea:focus {
        outline: none;
        border-color: #00ffca;
        box-shadow: 0 0 10px #00ffca55;
    }

    /* Botão de reiniciar */
    #restartBtn {
        margin-top: 20px;
        background-color: #00ffca;
        color: #0f172a;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }
    #restartBtn:hover { background-color: #00caa7; }

    /* Painel de estatísticas */
    .hud {
        margin-top: 20px;
        font-size: 1rem;
        color: #94a3b8;
        display: flex;
        justify-content: space-around;
    }

    /* Link para voltar */
    a {
        display: inline-block;
        margin-top: 15px;
        color: #00ffca;
        text-decoration: none;
        font-weight: 600;
    }
    a:hover { color: #0ff; }
</style>
</head>
<body>
<div class="typing-container">
    <h1>Teste de Digitação ⌨️</h1>
    <p>Digite a frase abaixo o mais rápido e correto que puder.</p>

    <!-- Onde a frase-desafio aparece -->
    <div class="sentence-display" id="sentenceDisplay">Carregando...</div>
    
    <!-- Onde o usuário digita -->
    <textarea id="inputArea" placeholder="Comece a digitar aqui..." autofocus></textarea>

    <!-- Botão para reiniciar/próxima frase -->
    <button id="restartBtn">Próxima Frase</button>

    <div class="hud">
        <p>Palavras por Minuto: <span id="wpmDisplay">0</span></p>
        <p>Precisão: <span id="accuracyDisplay">100</span>%</p>
        <p>Status: <span id="statusDisplay">Aguardando</span></p>
    </div>

    <a href="/">Voltar ao início</a>
</div>

<script src="{{ url_for('static', filename='js/typing.js') }}"></script>
</body>
</html>
