<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chimp Test Avançado | Mind Studio</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
    body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: 'Poppins', sans-serif;
        text-align: center;
        padding-top: 35px;
    }

    .chimp-container {
        max-width: 600px;
        margin: auto;
        background-color: #1e293b;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 255, 202, 0.3);
        position: relative;
    }

    h1 {
        color: #00ffca;
        margin-bottom: 10px;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-top: 25px;
    }

    .cell {
        background-color: #0f172a;
        border-radius: 12px;
        aspect-ratio: 1/1;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.8rem;
        cursor: pointer;
        transition: all 0.3s;
        color: #e2e8f0;
        user-select: none;
    }

    .cell.active {
        background-color: #00ffca;
        color: #0f172a;
        transform: scale(1.2);
        box-shadow: 0 0 20px #00ffca, 0 0 40px #00ffca55;
        animation: pulse 0.5s ease-in-out;
    }

    .cell.wrong {
        animation: shake 0.3s;
        background-color: #ff0033;
        color: #fff;
        box-shadow: 0 0 20px #ff0033, 0 0 40px #ff003355;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }

    #startBtn {
        margin-top: 20px;
        background-color: #00ffca;
        color: #0f172a;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    #startBtn:hover { background-color: #00caa7; }

    .hud {
        margin-top: 20px;
        font-size: 1rem;
        color: #94a3b8;
    }

    a {
        display: inline-block;
        margin-top: 15px;
        color: #00ffca;
        text-decoration: none;
        font-weight: 600;
    }

    a:hover { color: #0ff; }
</style>
</head>
<body>
<div class="chimp-container">
    <h1>Chimp Test 🐵</h1>
    <p>Repita a sequência de números. Cada nível adiciona mais um!</p>
    <button id="startBtn">Iniciar Jogo</button>

    <div class="board" id="board"></div>

    <div class="hud">
        <p>Nível: <span id="level">0</span></p>
        <p>Status: <span id="status">Aguardando início</span></p>
        <p>Recorde: <span id="highscore">0</span></p>
    </div>

    {% include "partials/save_form_ui.html" %}

    <a href="/#jogos">Voltar ao início</a>
</div>

<script src="{{ url_for('static', filename='js/chimp_test.js') }}"></script>
</body>
</html>
