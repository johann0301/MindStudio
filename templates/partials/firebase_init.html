<script type="module">
    // Importar as funções necessárias do SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Configuração do Firebase (fornecida pelo ambiente)
    const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const authToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // Habilitar logs para depuração
    setLogLevel('Debug');

    try {
        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Autenticar usuário
        if (authToken) {
            await signInWithCustomToken(auth, authToken);
        } else {
            await signInAnonymously(auth);
        }
        
        // Disponibilizar as funções do Firebase para o script do seu jogo
        window.gameApp = {
            db: db,
            appId: appId,
            addDoc: addDoc,
            collection: collection,
            serverTimestamp: serverTimestamp
        };

    } catch (e) {
        console.error("Erro ao inicializar o Firebase:", e);
        // Informa ao script do jogo que o Firebase falhou
        window.gameApp = null;
    }
</script>
